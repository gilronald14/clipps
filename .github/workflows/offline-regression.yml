name: Clipps offline regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-free:
    name: Pure-offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out development changes
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg if missing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }

      - name: Inspect FFmpeg features
        shell: bash
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          ffmpeg -hide_banner -filters | grep -E '(^| )showwaves|(^| )loudnorm|(^| )subtitles'

      - name: Run complete model-free regression suite
        env:
          PYTHONUTF8: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
